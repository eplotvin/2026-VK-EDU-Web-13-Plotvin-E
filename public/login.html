<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Вопросы и ответы</title>
  <link rel="icon" href="static/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="static/css/bootstrap.min.css">
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

  <!-- Header: логотип, поиск, юзерблок, кнопка создания вопроса -->
  <header class="border-bottom bg-white py-2">
    <div class="container d-flex flex-wrap align-items-center gap-2">
      <a href="index.html" class="navbar-brand fw-bold text-primary me-2">Вопросы</a>
      <form class="flex-grow-1 d-flex" role="search">
        <input class="form-control search-input w-100" type="search" placeholder="Поиск" aria-label="Поиск">
      </form>
      <a href="ask.html" class="btn btn-primary">Задать вопрос</a>
      <!-- Неавторизованный пользователь -->
      <div class="d-flex gap-2">
        <a href="login.html" class="btn btn-outline-secondary">Войти</a>
        <a href="signup.html" class="btn btn-outline-primary">Регистрация</a>
      </div>
      <!-- Для авторизованного: заменить блок выше на аватар и ник, профиль: profile.html -->
    </div>
  </header>

  <div class="container py-4">
    <div class="row g-4">

      <!-- Основная колонка -->
      <main class="col-lg-9 page-content">
        
        <div class="card mx-auto" style="max-width: 420px;">
          <div class="card-body p-4">
            <h1 class="h4 mb-4 text-center">Вход</h1>
            <div class="alert alert-danger" role="alert">Вы ввели неправильный email или пароль</div>
            <form novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" class="form-control is-invalid" value="user@example" aria-describedby="emailError">
                <div id="emailError" class="invalid-feedback">Вы ввели невалидный email</div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input id="password" type="password" class="form-control" autocomplete="current-password">
              </div>
              <button type="submit" class="btn btn-primary w-100 mb-3">Войти</button>
            </form>
            <p class="text-center small mb-0">Нет аккаунта? <a href="signup.html">Зарегистрироваться</a></p>
          </div>
        </div>

      </main>

      <!-- Правая колонка: Popular tags и Best members -->
      <aside class="col-lg-3">
        <div class="card sidebar-block">
          <div class="card-header bg-white fw-semibold">Популярные теги</div>
          <div class="card-body d-flex flex-wrap gap-2">
            <a href="#" class="badge text-bg-light text-decoration-none">python</a>
            <a href="#" class="badge text-bg-light text-decoration-none">javascript</a>
            <a href="#" class="badge text-bg-light text-decoration-none">django</a>
            <a href="#" class="badge text-bg-light text-decoration-none">html</a>
          </div>
        </div>
        <div class="card sidebar-block">
          <div class="card-header bg-white fw-semibold">Лучшие участники</div>
          <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex align-items-center gap-2">
              <img class="avatar" src="static/img/avatar-placeholder.svg" alt="">
              <span>Участник 1</span>
            </li>
            <li class="list-group-item d-flex align-items-center gap-2">
              <img class="avatar" src="static/img/avatar-placeholder.svg" alt="">
              <span>Участник 2</span>
            </li>
          </ul>
        </div>
      </aside>

    </div>
  </div>

  <!-- Footer: прибит к низу viewport -->
  <footer class="site-footer border-top bg-white py-3 text-center text-secondary small">
    © 2026 Вопросы и ответы
  </footer>

  <script src="static/js/bootstrap.bundle.min.js"></script>
  <script src="static/js/main.js"></script>
</body>
</html>
