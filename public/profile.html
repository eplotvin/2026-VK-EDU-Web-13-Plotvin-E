<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль — Вопросы и ответы</title>
  <link rel="icon" href="static/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="static/css/bootstrap.min.css">
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

  <!-- Header: логотип, поиск, юзерблок, кнопка создания вопроса -->
  <header class="border-bottom bg-white py-2">
    <div class="container d-flex flex-wrap align-items-center gap-2">
      <a href="index.html" class="navbar-brand fw-bold text-primary me-2">Вопросы</a>
      <form class="flex-grow-1 d-flex" role="search">
        <input class="form-control search-input w-100" type="search" placeholder="Поиск" aria-label="Поиск">
      </form>
      <a href="ask.html" class="btn btn-primary">Задать вопрос</a>
      <!-- Неавторизованный пользователь -->
      <div class="d-flex gap-2">
        <a href="login.html" class="btn btn-outline-secondary">Войти</a>
        <a href="signup.html" class="btn btn-outline-primary">Регистрация</a>
      </div>
      <!-- Для авторизованного: заменить блок выше на аватар и ник, профиль: profile.html -->
    </div>
  </header>

  <div class="container py-4">
    <div class="row g-4">

      <!-- Основная колонка -->
      <main class="col-lg-9 page-content">
        
        <div class="card">
          <div class="card-body p-4">
            <div class="d-flex align-items-center gap-3 mb-4">
              <img class="avatar" src="static/img/avatar-placeholder.svg" alt="Аватар пользователя" style="width:72px;height:72px">
              <div>
                <h1 class="h4 mb-0">Участник 1</h1>
                <div class="text-secondary small">Зарегистрирован в 2026 году</div>
              </div>
            </div>
            <form novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="p-nick" class="form-label">Имя пользователя</label>
                  <input id="p-nick" type="text" class="form-control" value="Участник 1" maxlength="30">
                </div>
                <div class="col-md-6">
                  <label for="p-email" class="form-label">Email</label>
                  <input id="p-email" type="email" class="form-control is-invalid" value="user@example" aria-describedby="p-emailError">
                  <div id="p-emailError" class="invalid-feedback">Вы ввели невалидный email</div>
                </div>
                <div class="col-12">
                  <label for="p-about" class="form-label">О себе</label>
                  <textarea id="p-about" class="form-control" rows="3" maxlength="500" aria-describedby="p-aboutHelp"></textarea>
                  <div id="p-aboutHelp" class="form-text">До 500 символов.</div>
                </div>
                <div class="col-md-6">
                  <label for="p-password" class="form-label">Новый пароль</label>
                  <input id="p-password" type="password" class="form-control" autocomplete="new-password">
                </div>
              </div>
              <div class="d-flex flex-wrap gap-2 mt-4">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <button type="reset" class="btn btn-outline-secondary">Отменить</button>
              </div>
            </form>
          </div>
        </div>

      </main>

      <!-- Правая колонка: Popular tags и Best members -->
      <aside class="col-lg-3">
        <div class="card sidebar-block">
          <div class="card-header bg-white fw-semibold">Популярные теги</div>
          <div class="card-body d-flex flex-wrap gap-2">
            <a href="#" class="badge text-bg-light text-decoration-none">python</a>
            <a href="#" class="badge text-bg-light text-decoration-none">javascript</a>
            <a href="#" class="badge text-bg-light text-decoration-none">django</a>
            <a href="#" class="badge text-bg-light text-decoration-none">html</a>
          </div>
        </div>
        <div class="card sidebar-block">
          <div class="card-header bg-white fw-semibold">Лучшие участники</div>
          <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex align-items-center gap-2">
              <img class="avatar" src="static/img/avatar-placeholder.svg" alt="">
              <span>Участник 1</span>
            </li>
            <li class="list-group-item d-flex align-items-center gap-2">
              <img class="avatar" src="static/img/avatar-placeholder.svg" alt="">
              <span>Участник 2</span>
            </li>
          </ul>
        </div>
      </aside>

    </div>
  </div>

  <!-- Footer: прибит к низу viewport -->
  <footer class="site-footer border-top bg-white py-3 text-center text-secondary small">
    © 2026 Вопросы и ответы
  </footer>

  <script src="static/js/bootstrap.bundle.min.js"></script>
  <script src="static/js/main.js"></script>
</body>
</html>
